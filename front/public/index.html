<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1117" />
  <meta name="description" content="Plataforma de treinos e acompanhamento físico" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Apple-specific (PWA on iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atlanteon">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="preload" as="image" href="/logo2.png" fetchpriority="high">
    <link rel="preload" as="image" href="/logo_texto.png" fetchpriority="high">
    <link rel="preload" as="image" href="/imgs/muscle.gif">


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <title>ATLANTEON</title>
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      /* Mesmo degradê vertical do ícone */
      background: linear-gradient(180deg, #3F86D8 0%, #2A62AA 50%, #163F7C 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 200px;
      height: 200px;
      object-fit: contain;
        margin-bottom: -75px;
      /* Logos são pretas com fundo transparente: viram brancas sobre o azul */
      filter: brightness(0) invert(1) drop-shadow(0 6px 10px rgba(8, 25, 55, 0.45));

    }
    #splash p {
      margin-top: 20px;
      font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
      font-size: 2rem;
      letter-spacing: 0.12em;
      color: #F9FBFD !important;
    }
    #splash {
      color: #F9FBFD !important;
    }
    /* Assinatura da Fenrys no rodapé da splash */
    #splash .splash-credito {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(28px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Barlow', Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(249, 251, 253, 0.75);
    }
    #splash .splash-credito img {
      width: 30px;
      height: 30px;
      margin: 0;
      filter: brightness(0) invert(1);
      /* Mesmo tom apagado do texto ao lado */
      opacity: 0.7;
    }
    /* Modo escuro: fundo do ícone escuro e logos no azul do tridente */
    html.splash-escuro #splash {
      background: #0B0F14;
    }
    html.splash-escuro #splash .splash-logo {
      filter: none;
    }
    html.splash-escuro #splash .splash-emblema {
      content: url(/splash-emblema-azul.png);
    }
    html.splash-escuro #splash .splash-texto {
      content: url(/splash-texto-azul.png);
    }
    html.splash-escuro #splash .splash-credito {
      color: rgba(249, 251, 253, 0.55);
    }
  </style>
  <script>
    // Mesma regra do AuthContext: escolha manual em 'tema', senão segue o celular
    try {
      var tema = localStorage.getItem('tema');
      if (!tema && localStorage.getItem('darkMode') === 'true') tema = 'escuro'; // chave antiga
      var escuro = tema ? tema === 'escuro'
        : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (escuro) document.documentElement.classList.add('splash-escuro');
    } catch (e) { /* storage indisponível */ }
  </script>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="splash">
  <img src="/logo2.png" alt="Atlanteon" class="splash-logo splash-emblema" />
    <img src="/logo_texto.png" alt="Atlanteon" class="splash-logo splash-texto" />
  <div class="splash-credito">
    <img src="/fenrys-logo.png" alt="" />
    <span>by Fenrys Technologies</span>
  </div>
</div>
<div id="root"></div>
</body>
</html>
